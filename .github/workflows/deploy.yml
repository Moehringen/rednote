name: Test and deploy rednote collector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rednote-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # These resource identifiers are not credentials. Keep secret overrides
          # for portability, but make the configured production project work out
          # of the box instead of passing empty auth inputs to google-github-actions/auth.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/449684825320/locations/global/workloadIdentityPools/github-actions/providers/github' }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || 'github-deployer@quanttrade-459605.iam.gserviceaccount.com' }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy over IAP/SSH
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'quanttrade-459605' }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || 'us-central1-b' }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE || 'instance-20261116-050519' }}
        run: |
          gcloud compute ssh --quiet "$GCP_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --command="bash -s -- '${GITHUB_SHA}'" \
            < scripts/deploy_vps.sh
