services:
  rednote-to-x:
    build:
      context: .
      args:
        XHS_VERSION: v0.2.0
    container_name: rednote-to-x
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      TZ: Asia/Singapore
      DATA_DIR: /app/data
      DB_PATH: /app/data/rednote_to_x.sqlite3
      XHS_CONFIG_DIR: /app/data/xhs-config
      XHS_CACHE_DIR: /app/data/xhs-cache
      XHS_COOKIE_FILE: /app/data/cookies/xhs.cookie
      BROWSER_PROFILE_DIR: /app/data/browser-profile
      BROWSER_EXECUTABLE_PATH: ""
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-m", "app", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
