services:
  rednote-to-x:
    build:
      context: .
      args:
        XHS_VERSION: v0.2.0
    container_name: rednote-to-x
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /tmp/.X11-unix:mode=1777
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      TZ: Asia/Singapore
      DATA_DIR: /app/data
      DB_PATH: /app/data/rednote_to_x.sqlite3
      XHS_CONFIG_DIR: /app/data/xhs-config
      XHS_CACHE_DIR: /app/data/xhs-cache
      XHS_COOKIE_FILE: /app/data/cookies/xhs.cookie
      XHS_BACKEND: "${XHS_BACKEND:-cli}"
      BROWSER_PROFILE_DIR: /app/data/browser-profile
      BROWSER_EXECUTABLE_PATH: "${BROWSER_EXECUTABLE_PATH:-/usr/bin/chromium}"
      BROWSER_HEADLESS: "${BROWSER_HEADLESS:-false}"
      BROWSER_LOGIN_TIMEOUT_SECONDS: "${BROWSER_LOGIN_TIMEOUT_SECONDS:-180}"
      REMOTE_DESKTOP: "${REMOTE_DESKTOP:-false}"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
    ports:
      - "127.0.0.1:6080:6080"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-m", "app", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
